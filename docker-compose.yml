services:
  mongo:
    image: mongo:7
    container_name: growth-bot-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - growth_bot_mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root_password

volumes:
  growth_bot_mongo_data:
